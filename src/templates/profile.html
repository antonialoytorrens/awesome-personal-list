<div class="page-head">
<h1 class="page-title">[[profile.title]]</h1>
</div>
<div class="form-card">
<p class="lede">[[profile.member_since]] $CREATED$</p>
<form method="post" action="/profile">
<input type="hidden" name="csrf" value="$CSRF$">
<label>[[profile.name]]<input type="text" name="name" value="$NAME$" maxlength="127" required></label>
<label>[[profile.language]]<select name="lang">$LANG_OPTIONS$</select></label>
<div class="form-actions">
<button type="submit" class="btn btn-primary">[[actions.save]]</button>
<button type="reset" class="btn btn-ghost">[[actions.cancel]]</button>
</div>
</form>
</div>
