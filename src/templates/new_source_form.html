<div class="page-head">
<h1 class="page-title">[[new_source_form.title]]</h1>
</div>

<form class="form-card" method="post" action="/sources/new">
<input type="hidden" name="csrf" value="$CSRF$">
<label>[[fields.original_url]]<input type="url" name="original_url" value="$ORIGINAL_URL$" placeholder="https://github.com/owner/repo" required></label>
<label>[[fields.description]]<textarea name="description" rows="2">$DESCRIPTION$</textarea></label>
<label>[[fields.language]]<input type="text" name="language" value="$LANGUAGE$"></label>
<label>[[new_source_form.categories_label]]<div class="cats">$CATEGORY_OPTIONS$</div></label>
<label>[[fields.notes]]<textarea name="notes" rows="3">$NOTES$</textarea></label>
<div class="form-actions">
<button type="submit" class="btn btn-primary">[[new_source_form.submit]]</button>
</div>
</form>
