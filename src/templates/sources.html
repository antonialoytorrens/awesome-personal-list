<div class="page-head">
<h1 class="page-title">[[sources.title]]</h1>
<p class="lede">$LEDE$</p>
<form class="search-box" method="get" action="/sources">
<input type="hidden" name="category" value="$CATEGORY$">
<select name="language">
<option value="">[[sources.all_languages]]</option>
$LANGUAGE_OPTIONS$
</select>
<input type="search" name="q" value="$QUERY$" placeholder="[[sources.search_placeholder]]">
<button type="submit" class="btn btn-sm">[[actions.apply]]</button>
</form>
</div>
<div class="stars-layout">
<aside class="stars-side">
<h2 class="side-title">[[sources.categories_heading]]</h2>
<nav class="side-list">$SIDEBAR$</nav>
</aside>
<div class="stars-main">
<form method="post" action="/sources" class="bulk-form">
<input type="hidden" name="csrf" value="$CSRF$">
<input type="hidden" name="category" value="$CATEGORY$">
<input type="hidden" name="language" value="$LANGUAGE$">
<input type="hidden" name="q" value="$QUERY$">
<input type="hidden" name="page" value="$PAGE$">
<input type="hidden" name="per_page" value="$PER_PAGE$">
<div class="bulk-toolbar">
<label class="select-all"><input type="checkbox" class="all-check" name="all_matching" value="1"> $BULK_SELECT_ALL_LABEL$</label>
<div class="bulk-actions bulk-actions--off">
<select disabled><option>[[sources.bulk_category_placeholder]]</option></select>
<button type="button" class="btn btn-sm" disabled>[[sources.bulk_add_category]]</button>
<button type="button" class="btn btn-sm btn-danger" disabled>[[sources.bulk_delete]]</button>
</div>
<div class="bulk-actions bulk-actions--live">
<select name="bulk_category">
<option value="">[[sources.bulk_category_placeholder]]</option>
$BULK_CATEGORY_OPTIONS$
</select>
<button type="submit" name="bulk_action" value="add_category" class="btn btn-sm"><span class="when-page">[[sources.bulk_add_category]]</span><span class="when-all">$BULK_ADD_ALL_LABEL$</span></button>
<details class="confirm">
<summary class="btn btn-sm btn-danger"><span class="when-closed">[[sources.bulk_delete]]</span><span class="when-open">[[actions.cancel]]</span></summary>
<div class="confirm-pop">
<p class="when-page">[[sources.bulk_confirm_delete]]</p>
<p class="when-all">$BULK_DELETE_ALL_CONFIRM$</p>
<button type="submit" name="bulk_action" value="delete" class="btn btn-sm btn-danger"><span class="when-page">[[actions.confirm_delete]]</span><span class="when-all">$BULK_DELETE_ALL_LABEL$</span></button>
</div>
</details>
</div>
</div>
<div class="stars-list">
$ROWS$
</div>
</form>
</div>
</div>
$PAGER$
